name: Build the Android app (My Teaching Hub)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the hub inside the app and build
        env:
          # Optional repository secret KS_PASS (the keystore password). Without it the APK is built unsigned and signed afterwards.
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          cp dist/hub.html android/app/src/main/assets/hub.html
          sha256sum dist/hub.html | cut -d' ' -f1 > android/app/src/main/assets/hub.sha256
          cd android
          gradle assembleRelease --no-daemon --stacktrace
          VERSION=$(cat VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p ../out
          if [ -n "$KS_PASS" ]; then
            cp app/build/outputs/apk/release/app-release.apk "../out/My-Teaching-Hub-$VERSION.apk"
            echo "SIGNED=yes" >> $GITHUB_ENV
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "../out/My-Teaching-Hub-$VERSION-unsigned.apk"
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            cp "$BT/lib/apksigner.jar" ../out/apksigner.jar
            echo "SIGNED=no" >> $GITHUB_ENV
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}-build${{ github.run_number }}
          name: My Teaching Hub for Android ${{ env.VERSION }} (build ${{ github.run_number }})
          prerelease: ${{ env.SIGNED != 'yes' }}
          make_latest: false
          body: |
            Android app of the teacher (Master) hub, for Promethean ActivPanels, Android tablets and phones (Android 7 or newer).
            Download the .apk file and open it to install. The hub inside updates itself over the internet.
          files: out/*
